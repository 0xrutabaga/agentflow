[project]
name = "agentflow"
version = "0.1.0"
description = "Checkpointed runtime for tool-using LLM agents: SQLite step checkpoints, crash resume, tool retries with idempotency rules, schema-validated output with bounded repair."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "0xrutabaga" }]
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "jsonschema>=4.23"]

[project.scripts]
agentflow = "agentflow.cli:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8", "types-jsonschema>=4.23"]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; subprocess calls in tests run this package's own CLI.
"tests/**" = ["S101", "S603"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
